[project]
name = "pyml-assignment-2"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.4.4",
    "torch==2.11.0",
    "matplotlib==3.10.9",
    # QA
    "mypy==1.20.2",
    "ruff==0.15.12",
    "pre-commit==4.6.0",
    "nbqa[toolchain]==1.9.1",
]

# Torch comes from the CPU-only index, so nobody downloads the CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 150

[tool.ruff.lint]
ignore = [
    "E402",  # module level import not at top of file
    "F401",  # unused imports
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = [
    "empty-body",    # skeleton functions students must implement
    "arg-type",      # doctest examples and skeleton call sites
    "union-attr",    # submit.py infrastructure (spec may be None)
    "no-any-return", # numpy operators return Any in stubs
]
